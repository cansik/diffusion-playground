[project]
name = "diffusion-playground"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate>=1,<2",
    "bezier>=2024.6.20",
    "diffusers>=0.43,<0.44",
    "ffmpegio>=0.12,<0.13",
    "gradio>=6.32,<7",
    "matplotlib>=3.10,<4",
    "numpy>=2,<3",
    "pillow>=11,<13",
    "safetensors>=0.6,<1",
    "torch>=2.15,<3",
    "tqdm>=4.67,<5",
    "transformers>=5,<6",
]

[tool.uv]
package = false
environments = ["sys_platform != 'darwin' or platform_machine == 'arm64'"]
